name: Deploy portfolio

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "LICENSE.*"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      publish: ${{ steps.changes.outputs.publish }}
      run_quality: ${{ steps.changes.outputs.run_quality }}
      e2e_suite: ${{ steps.changes.outputs.e2e_suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          FORCED_PUSH: ${{ github.event.forced || false }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          classification="$(node scripts/ci/classify-changes.mjs \
            --event "$EVENT_NAME" \
            --forced "$FORCED_PUSH" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA")"
          printf '%s\n' "$classification"
          printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"

  prepare-cv:
    needs: classify
    if: ${{ needs.classify.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore exact CV outputs
        id: cv-cache
        uses: actions/cache@v6
        with:
          path: |
            public/cv
            public/assets/cv_yuri_website.pdf
          key: ${{ runner.os }}-cv-pdfs-v2-${{ hashFiles('cv/src/**', 'cv/Dockerfile', 'cv/Makefile', 'cv/scripts/**') }}
      - name: Build, verify, and publish CVs
        if: ${{ steps.cv-cache.outputs.cache-hit != 'true' }}
        run: make -C cv publish
      - name: Validate prepared CV outputs
        run: |
          expected_pdfs=(
            public/cv/yuri-rocha-cv-en.pdf
            public/cv/yuri-rocha-cv-ko.pdf
            public/cv/yuri-rocha-resume-en.pdf
            public/cv/yuri-rocha-resume-ko.pdf
            public/assets/cv_yuri_website.pdf
          )
          for pdf in "${expected_pdfs[@]}"; do
            test -s "$pdf"
            test "$(head -c 5 "$pdf")" = "%PDF-"
          done
          cmp public/cv/yuri-rocha-cv-en.pdf public/assets/cv_yuri_website.pdf
      - name: Share prepared CVs
        uses: actions/upload-artifact@v6
        with:
          name: cv-pdfs
          path: |
            public/cv/*.pdf
            public/assets/cv_yuri_website.pdf
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  quality:
    needs: classify
    if: ${{ needs.classify.outputs.run_quality == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        if: ${{ needs.classify.outputs.mode == 'content' }}
        run: npm run test:unit
      - name: Unit tests and coverage
        if: ${{ needs.classify.outputs.mode != 'content' }}
        run: npm run test:coverage
      - name: Check generated changes and whitespace
        run: git diff --check

  site:
    needs:
      - classify
      - prepare-cv
    if: ${{ needs.classify.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Download prepared CVs
        uses: actions/download-artifact@v8
        with:
          name: cv-pdfs
          path: public
      - name: Validate downloaded CVs
        run: |
          test -s public/cv/yuri-rocha-cv-en.pdf
          test -s public/cv/yuri-rocha-cv-ko.pdf
          test -s public/cv/yuri-rocha-resume-en.pdf
          test -s public/cv/yuri-rocha-resume-ko.pdf
          test -s public/assets/cv_yuri_website.pdf
      - name: Build production site
        run: npm run build:site
      - name: Install Playwright Chromium
        if: ${{ needs.classify.outputs.e2e_suite != 'none' }}
        run: npx playwright install --with-deps chromium
      - name: Fast browser tests
        if: ${{ needs.classify.outputs.e2e_suite == 'fast' }}
        run: npm run test:e2e:fast
      - name: Full browser tests
        if: ${{ needs.classify.outputs.e2e_suite == 'full' }}
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: ${{ failure() && needs.classify.outputs.e2e_suite != 'none' }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Pages artifact
        if: ${{ needs.classify.outputs.publish == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs:
      - classify
      - quality
      - site
    if: >-
      ${{ always()
          && needs.classify.outputs.publish == 'true'
          && needs.classify.result == 'success'
          && (needs.quality.result == 'success' || needs.quality.result == 'skipped')
          && needs.site.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
